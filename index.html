<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>p50 — Tetris</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0b0d12;color:#dfe7f5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:10px}
  #stage{display:flex;gap:10px;align-items:flex-start;flex-wrap:nowrap}
  canvas{background:#05070b;display:block;border:1px solid #1c2330;border-radius:4px;image-rendering:pixelated}
  #touch{display:none;gap:8px;width:100%;justify-content:center;flex-wrap:nowrap}
  #touch button{flex:1;min-width:60px;max-width:120px;height:60px;font-size:22px;background:#1a2030;color:#dfe7f5;border:1px solid #2a3447;border-radius:8px;font-family:inherit}
  #touch button:active{background:#2a3447}
  body.touch #touch{display:flex}
  body.landscape #touch{display:grid;grid-template-columns:repeat(2,minmax(64px,90px));grid-auto-rows:60px;width:auto}
  body.landscape #stage{flex-direction:row}
  .hint{font-size:11px;color:#7a8aa6;text-align:center;max-width:90vw}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
  <div id="touch">
    <button id="bL" aria-label="left">&larr;</button>
    <button id="bR_rot" aria-label="rotate">&#8635;</button>
    <button id="bD" aria-label="drop">&darr;</button>
    <button id="bR" aria-label="right">&rarr;</button>
  </div>
  <div class="hint">&larr; &rarr; move &middot; &uarr; rotate &middot; &darr; soft drop &middot; Space hard drop &middot; P pause &middot; R restart</div>
</div>
<script>
(() => {
'use strict';

// ---------- constants ----------
const COLS = 10, ROWS = 20;
const LOGIC_HZ = 60, STEP_MS = 1000 / LOGIC_HZ;
const DAS_MS = 170, ARR_MS = 50;
const SOFT_DROP_TICKS = 2; // 1 cell per 2 ticks ~ 30Hz
const COLORS = {
  I:'#3ad1ff', O:'#ffd23a', T:'#c673ff', S:'#5dd45d',
  Z:'#ff5d6c', J:'#5a86ff', L:'#ff9d3a', '#':'#222a3a'
};

// rotation tables (4 states each), each is 4x4 mask of [r,c]
const SHAPES = {
  I: [
    [[0,0],[0,1],[0,2],[0,3]],
    [[0,2],[1,2],[2,2],[3,2]],
    [[1,0],[1,1],[1,2],[1,3]],
    [[0,1],[1,1],[2,1],[3,1]]
  ],
  O: [
    [[0,1],[0,2],[1,1],[1,2]],
    [[0,1],[0,2],[1,1],[1,2]],
    [[0,1],[0,2],[1,1],[1,2]],
    [[0,1],[0,2],[1,1],[1,2]]
  ],
  T: [
    [[0,1],[1,0],[1,1],[1,2]],
    [[0,1],[1,1],[1,2],[2,1]],
    [[1,0],[1,1],[1,2],[2,1]],
    [[0,1],[1,0],[1,1],[2,1]]
  ],
  S: [
    [[0,1],[0,2],[1,0],[1,1]],
    [[0,1],[1,1],[1,2],[2,2]],
    [[1,1],[1,2],[2,0],[2,1]],
    [[0,0],[1,0],[1,1],[2,1]]
  ],
  Z: [
    [[0,0],[0,1],[1,1],[1,2]],
    [[0,2],[1,1],[1,2],[2,1]],
    [[1,0],[1,1],[2,1],[2,2]],
    [[0,1],[1,0],[1,1],[2,0]]
  ],
  J: [
    [[0,0],[1,0],[1,1],[1,2]],
    [[0,1],[0,2],[1,1],[2,1]],
    [[1,0],[1,1],[1,2],[2,2]],
    [[0,1],[1,1],[2,0],[2,1]]
  ],
  L: [
    [[0,2],[1,0],[1,1],[1,2]],
    [[0,1],[1,1],[2,1],[2,2]],
    [[1,0],[1,1],[1,2],[2,0]],
    [[0,0],[0,1],[1,1],[2,1]]
  ]
};

const KINDS = ['I','O','T','S','Z','J','L'];

function gravityPeriod(level){ return Math.max(1, 48 - level*5); }

// ---------- bag ----------
function newBag(){
  const b = KINDS.slice();
  for (let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

// ---------- board helpers ----------
function emptyBoard(){
  const b = new Array(ROWS);
  for (let r=0;r<ROWS;r++){ b[r] = new Array(COLS).fill(null); }
  return b;
}
function pieceCells(p){
  const s = SHAPES[p.kind][p.rotation];
  const out = [];
  for (const [dr,dc] of s) out.push([p.y+dr, p.x+dc]);
  return out;
}
function canPlace(board, p){
  for (const [r,c] of pieceCells(p)){
    if (c<0||c>=COLS||r>=ROWS) return false;
    if (r>=0 && board[r][c]) return false;
  }
  return true;
}
function lockPiece(board, p){
  for (const [r,c] of pieceCells(p)){
    if (r>=0 && r<ROWS && c>=0 && c<COLS) board[r][c] = p.kind;
  }
}
function clearLines(board){
  let count = 0;
  for (let r=ROWS-1;r>=0;){
    if (board[r].every(c=>c!==null)){
      board.splice(r,1);
      board.unshift(new Array(COLS).fill(null));
      count++;
    } else r--;
  }
  return count;
}
function spawnPiece(kind){
  // spawn near top-center; small offset so wide I sits nicely
  return { kind, rotation:0, x: (kind==='O'?4:3), y: -1 };
}

// ---------- input controller ----------
const InputCtl = (() => {
  const queue = [];
  // held key state for DAS/ARR
  let leftDown=false, rightDown=false, softDown=false;
  let dasDir=0, dasTimer=0, arrTimer=0;
  // touch held tracking (not used for DAS but cleared on lift)
  const heldTouches = new Set();

  function push(intent){ queue.push(intent); }

  function onKeyDown(e){
    if (e.repeat) return;
    switch(e.code){
      case 'ArrowLeft':
        if (!leftDown){ leftDown=true; push('MoveLeft'); dasDir=-1; dasTimer=DAS_MS; arrTimer=0; }
        e.preventDefault(); break;
      case 'ArrowRight':
        if (!rightDown){ rightDown=true; push('MoveRight'); dasDir=1; dasTimer=DAS_MS; arrTimer=0; }
        e.preventDefault(); break;
      case 'ArrowUp': case 'KeyX': push('RotateCW'); e.preventDefault(); break;
      case 'ArrowDown':
        softDown=true; push('SoftDropOn'); e.preventDefault(); break;
      case 'Space':
        push('HardDrop'); e.preventDefault(); break;
      case 'KeyP':
        push('Pause'); e.preventDefault(); break;
      case 'KeyR':
        push('Restart'); e.preventDefault(); break;
      default:
        push('Any'); break;
    }
  }
  function onKeyUp(e){
    switch(e.code){
      case 'ArrowLeft':
        leftDown=false;
        if (dasDir===-1){ dasDir = rightDown?1:0; dasTimer=rightDown?DAS_MS:0; arrTimer=0; }
        break;
      case 'ArrowRight':
        rightDown=false;
        if (dasDir===1){ dasDir = leftDown?-1:0; dasTimer=leftDown?DAS_MS:0; arrTimer=0; }
        break;
      case 'ArrowDown':
        softDown=false; push('SoftDropOff'); break;
    }
  }
  function tick(dtMs){
    if (dasDir!==0){
      if (dasTimer>0){
        dasTimer -= dtMs;
        if (dasTimer<=0){ arrTimer = 0; }
      } else {
        arrTimer -= dtMs;
        if (arrTimer<=0){
          push(dasDir===-1 ? 'MoveLeft' : 'MoveRight');
          arrTimer += ARR_MS;
        }
      }
    }
  }
  function drain(){ const q = queue.slice(); queue.length=0; return q; }
  function reset(){
    queue.length=0;
    leftDown=rightDown=softDown=false;
    dasDir=0; dasTimer=0; arrTimer=0;
    heldTouches.clear();
  }
  function softHeld(){ return softDown; }

  return { onKeyDown, onKeyUp, tick, drain, reset, push, softHeld };
})();

// ---------- audio ----------
const Audio = (() => {
  let ctx=null;
  function ensure(){
    if (!ctx){
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ ctx=null; }
    }
    if (ctx && ctx.state==='suspended') ctx.resume().catch(()=>{});
  }
  function tone(freq, dur, type='square', vol=0.06){
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur);
  }
  function play(evt){
    ensure();
    if (!ctx) return;
    switch(evt){
      case 'lock': tone(140, 0.05, 'square', 0.05); break;
      case 'clear': tone(660, 0.08, 'triangle', 0.08); setTimeout(()=>tone(880,0.1,'triangle',0.08),60); break;
      case 'tetris':
        tone(523, 0.08, 'square', 0.09);
        setTimeout(()=>tone(659,0.08,'square',0.09),60);
        setTimeout(()=>tone(784,0.08,'square',0.09),120);
        setTimeout(()=>tone(1047,0.18,'square',0.09),180);
        break;
      case 'gameover':
        tone(330,0.2,'sawtooth',0.07);
        setTimeout(()=>tone(247,0.25,'sawtooth',0.07),200);
        setTimeout(()=>tone(165,0.4,'sawtooth',0.07),450);
        break;
      case 'move': tone(220,0.015,'square',0.02); break;
    }
  }
  return { play, ensure };
})();

// ---------- persistence ----------
const Storage = (() => {
  const KEY = 'p50.bestScore';
  function readBest(){
    try {
      const v = localStorage.getItem(KEY);
      if (v===null) return null;
      const n = parseInt(v, 10);
      if (!Number.isFinite(n) || n < 0 || String(n) !== v.trim()) return null;
      return n;
    } catch(e){ return null; }
  }
  function writeBest(score){
    try {
      const cur = readBest();
      if (cur===null || score > cur) localStorage.setItem(KEY, String(score));
    } catch(e){}
  }
  return { readBest, writeBest };
})();

// ---------- game state ----------
function newGame(){
  return {
    board: emptyBoard(),
    active: null,
    next: null,
    bag: [],
    score: 0,
    lines: 0,
    level: 0,
    status: 'title', // title | playing | paused | gameover
    gravityTicks: gravityPeriod(0),
    gravityCounter: 0,
    softCounter: 0,
    clearFlash: 0,
    clearRows: [],
    best: Storage.readBest()
  };
}
function nextFromBag(state){
  if (state.bag.length===0) state.bag = newBag();
  return state.bag.shift();
}
function startGame(state){
  state.board = emptyBoard();
  state.score = 0; state.lines = 0; state.level = 0;
  state.gravityTicks = gravityPeriod(0);
  state.gravityCounter = 0; state.softCounter = 0;
  state.bag = newBag();
  state.next = nextFromBag(state);
  spawnNext(state);
  state.status = 'playing';
}
function spawnNext(state){
  state.active = spawnPiece(state.next);
  state.next = nextFromBag(state);
  state.gravityCounter = 0;
  state.softCounter = 0;
  // block-out detection
  if (!canPlace(state.board, state.active)){
    state.status = 'gameover';
    Storage.writeBest(state.score);
    state.best = Storage.readBest();
    Audio.play('gameover');
  }
}
function tryMove(state, dx, dy){
  const p = state.active;
  const np = {...p, x:p.x+dx, y:p.y+dy};
  if (canPlace(state.board, np)){
    state.active = np;
    return true;
  }
  return false;
}
function tryRotate(state){
  const p = state.active;
  const np = {...p, rotation:(p.rotation+1)%4};
  if (canPlace(state.board, np)){
    state.active = np;
    return true;
  }
  return false;
}
function hardDrop(state){
  let dist = 0;
  while (true){
    const np = {...state.active, y: state.active.y+1};
    if (canPlace(state.board, np)){ state.active = np; dist++; }
    else break;
  }
  state.score += 2*dist;
  lockAndClear(state);
}
function lockAndClear(state){
  lockPiece(state.board, state.active);
  const cleared = clearLines(state.board);
  if (cleared > 0){
    const mult = [0,40,100,300,1200][cleared] || 0;
    state.score += mult * (state.level + 1);
    state.lines += cleared;
    const newLevel = Math.floor(state.lines / 10);
    if (newLevel !== state.level){
      state.level = newLevel;
      state.gravityTicks = gravityPeriod(state.level);
    }
    if (cleared === 4) Audio.play('tetris');
    else Audio.play('clear');
  } else {
    Audio.play('lock');
  }
  state.active = null;
}

// ---------- step ----------
function step(state, intents){
  // handle title / gameover transitions
  if (state.status === 'title'){
    if (intents.length > 0){
      const i0 = intents[0];
      if (i0 === 'Pause') return; // P does nothing on title
      startGame(state);
    }
    return;
  }
  if (state.status === 'gameover'){
    for (const it of intents){
      if (it === 'Restart'){ startGame(state); return; }
    }
    return;
  }
  if (state.status === 'paused'){
    for (const it of intents){
      if (it === 'Pause'){ state.status = 'playing'; InputCtl.reset(); return; }
      if (it === 'Restart'){ state.status = 'title'; InputCtl.reset(); return; }
    }
    return;
  }
  // playing
  let softOn = InputCtl.softHeld();
  for (const it of intents){
    if (it === 'Pause'){ state.status = 'paused'; InputCtl.reset(); return; }
    if (it === 'Restart'){ /* ignored while playing */ continue; }
    if (state.active === null){ continue; }
    if (it === 'MoveLeft'){ tryMove(state, -1, 0); }
    else if (it === 'MoveRight'){ tryMove(state, 1, 0); }
    else if (it === 'RotateCW'){ tryRotate(state); }
    else if (it === 'HardDrop'){
      hardDrop(state);
      if (state.status === 'playing') spawnNext(state);
      return;
    }
    else if (it === 'SoftDropOn'){ softOn = true; }
    else if (it === 'SoftDropOff'){ softOn = false; }
  }
  // gravity / soft drop
  if (state.active){
    state.gravityCounter++;
    let moved = false;
    if (state.gravityCounter >= state.gravityTicks){
      state.gravityCounter = 0;
      const ok = tryMove(state, 0, 1);
      moved = ok;
      if (!ok){
        lockAndClear(state);
        if (state.status === 'playing') spawnNext(state);
        return;
      }
    }
    if (softOn && state.active){
      state.softCounter++;
      if (state.softCounter >= SOFT_DROP_TICKS){
        state.softCounter = 0;
        if (state.gravityTicks >= SOFT_DROP_TICKS){
          const ok = tryMove(state, 0, 1);
          if (ok){ state.score += 1; }
          else {
            lockAndClear(state);
            if (state.status === 'playing') spawnNext(state);
            return;
          }
        }
      }
    }
  }
}

// ---------- renderer ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let cellPx = 30;
let hudW = 130; // hud width in CSS px
let dpr = window.devicePixelRatio || 1;
let boardOffsetX = 0;

function computeLayout(){
  const w = window.innerWidth, h = window.innerHeight;
  document.body.classList.toggle('touch', matchMedia('(pointer: coarse)').matches || w < 768);
  const landscape = w >= h;
  document.body.classList.toggle('landscape', landscape && (matchMedia('(pointer: coarse)').matches && w < 1024 || (w >= 768 && h < 600)));
  if (w >= 768 && h >= 600){ cellPx = 30; }
  else if (w < 768){ cellPx = Math.max(12, Math.floor(w / 12)); }
  else { cellPx = Math.max(12, Math.floor(h / 22)); }
  hudW = Math.max(110, Math.floor(cellPx * 4.2));
  const cssW = COLS*cellPx + hudW + 8;
  const cssH = ROWS*cellPx;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  boardOffsetX = 0;
}

function drawCell(x,y,color){
  ctx.fillStyle = color;
  ctx.fillRect(x, y, cellPx, cellPx);
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.fillRect(x, y, cellPx, 2);
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.fillRect(x, y+cellPx-2, cellPx, 2);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(x+cellPx-2, y, 2, cellPx);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x+0.5, y+0.5, cellPx-1, cellPx-1);
}

function drawBoard(state){
  // background
  ctx.fillStyle = '#05070b';
  ctx.fillRect(0,0, COLS*cellPx, ROWS*cellPx);
  // grid
  ctx.strokeStyle = '#0f1422';
  ctx.lineWidth = 1;
  for (let i=1;i<COLS;i++){
    ctx.beginPath(); ctx.moveTo(i*cellPx+0.5, 0); ctx.lineTo(i*cellPx+0.5, ROWS*cellPx); ctx.stroke();
  }
  for (let j=1;j<ROWS;j++){
    ctx.beginPath(); ctx.moveTo(0, j*cellPx+0.5); ctx.lineTo(COLS*cellPx, j*cellPx+0.5); ctx.stroke();
  }
  // locked cells
  for (let r=0;r<ROWS;r++){
    for (let c=0;c<COLS;c++){
      const k = state.board[r][c];
      if (k) drawCell(c*cellPx, r*cellPx, COLORS[k]);
    }
  }
  // active piece + ghost
  if (state.active){
    // ghost
    const p = state.active;
    let gy = p.y;
    while (canPlace(state.board, {...p, y: gy+1})) gy++;
    const ghost = {...p, y: gy};
    if (gy !== p.y){
      ctx.globalAlpha = 0.22;
      for (const [r,c] of pieceCells(ghost)){
        if (r>=0) drawCell(c*cellPx, r*cellPx, COLORS[p.kind]);
      }
      ctx.globalAlpha = 1;
    }
    for (const [r,c] of pieceCells(p)){
      if (r>=0) drawCell(c*cellPx, r*cellPx, COLORS[p.kind]);
    }
  }
}

function drawHUD(state){
  const x0 = COLS*cellPx + 8;
  ctx.fillStyle = '#0b0f1a';
  ctx.fillRect(x0, 0, hudW, ROWS*cellPx);
  ctx.fillStyle = '#dfe7f5';
  ctx.textBaseline = 'top';
  const pad = 10;
  const fs = Math.max(11, Math.floor(cellPx*0.42));
  ctx.font = `${fs}px ui-monospace,monospace`;
  let y = pad;
  function label(s, v){
    ctx.fillStyle = '#7a8aa6';
    ctx.fillText(s, x0+pad, y);
    y += fs + 2;
    ctx.fillStyle = '#dfe7f5';
    ctx.fillText(v, x0+pad, y);
    y += fs + 10;
  }
  label('SCORE', String(state.score));
  label('LINES', String(state.lines));
  label('LEVEL', String(state.level));
  label('BEST', state.best===null ? '—' : String(state.best));
  // next preview
  ctx.fillStyle = '#7a8aa6';
  ctx.fillText('NEXT', x0+pad, y);
  y += fs + 6;
  if (state.next){
    const cells = SHAPES[state.next][0];
    const minR = Math.min(...cells.map(c=>c[0]));
    const minC = Math.min(...cells.map(c=>c[1]));
    const maxR = Math.max(...cells.map(c=>c[0]));
    const maxC = Math.max(...cells.map(c=>c[1]));
    const w = (maxC-minC+1), h = (maxR-minR+1);
    const sz = Math.min(Math.floor((hudW - pad*2) / 4), Math.floor(cellPx*0.7));
    const ox = x0 + pad + Math.floor((hudW - pad*2 - w*sz)/2);
    const oy = y;
    ctx.fillStyle = '#05070b';
    ctx.fillRect(x0+pad, y-2, hudW-pad*2, sz*3 + 8);
    for (const [r,c] of cells){
      const cx = ox + (c-minC)*sz;
      const cy = oy + (r-minR)*sz;
      ctx.fillStyle = COLORS[state.next];
      ctx.fillRect(cx, cy, sz, sz);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.strokeRect(cx+0.5, cy+0.5, sz-1, sz-1);
    }
  }
}

function drawOverlay(state){
  const w = COLS*cellPx, h = ROWS*cellPx;
  if (state.status === 'title' || state.status === 'paused' || state.status === 'gameover'){
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0,0,w,h);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    const big = Math.max(20, Math.floor(cellPx*1.0));
    const sml = Math.max(11, Math.floor(cellPx*0.42));
    if (state.status === 'title'){
      ctx.font = `bold ${big}px ui-monospace,monospace`;
      ctx.fillText('p50 TETRIS', w/2, h/2 - big);
      ctx.font = `${sml}px ui-monospace,monospace`;
      ctx.fillStyle = '#dfe7f5';
      ctx.fillText('Press any key to start', w/2, h/2);
      ctx.fillStyle = '#7a8aa6';
      ctx.fillText('Best: ' + (state.best===null ? '—' : state.best), w/2, h/2 + sml + 8);
    } else if (state.status === 'paused'){
      ctx.font = `bold ${big}px ui-monospace,monospace`;
      ctx.fillText('Paused', w/2, h/2 - sml);
      ctx.font = `${sml}px ui-monospace,monospace`;
      ctx.fillStyle = '#dfe7f5';
      ctx.fillText('P to resume · R to quit', w/2, h/2 + big*0.4);
    } else { // gameover
      ctx.font = `bold ${big}px ui-monospace,monospace`;
      ctx.fillStyle = '#ff8a8a';
      ctx.fillText('Game Over', w/2, h/2 - big);
      ctx.font = `${sml}px ui-monospace,monospace`;
      ctx.fillStyle = '#dfe7f5';
      ctx.fillText('Score: ' + state.score, w/2, h/2);
      ctx.fillStyle = '#7a8aa6';
      ctx.fillText('Press R to restart', w/2, h/2 + sml + 8);
    }
    ctx.textAlign = 'start';
    ctx.textBaseline = 'top';
  }
}

function render(state){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBoard(state);
  drawHUD(state);
  drawOverlay(state);
}

// ---------- bootstrap ----------
const state = newGame();

window.addEventListener('keydown', (e) => {
  Audio.ensure();
  InputCtl.onKeyDown(e);
});
window.addEventListener('keyup', InputCtl.onKeyUp);
window.addEventListener('blur', () => { InputCtl.reset(); });

// touch buttons
function bindBtn(id, intent){
  const el = document.getElementById(id);
  const fire = (e) => { e.preventDefault(); Audio.ensure(); InputCtl.push(intent); };
  el.addEventListener('touchstart', fire, {passive:false});
  el.addEventListener('mousedown', fire);
}
bindBtn('bL','MoveLeft');
bindBtn('bR','MoveRight');
bindBtn('bR_rot','RotateCW');
bindBtn('bD','HardDrop');

// also allow tap anywhere on canvas in title/gameover to start
canvas.addEventListener('touchstart', (e) => {
  Audio.ensure();
  if (state.status === 'title'){ e.preventDefault(); InputCtl.push('Any'); }
  else if (state.status === 'gameover'){ e.preventDefault(); InputCtl.push('Restart'); }
}, {passive:false});
canvas.addEventListener('mousedown', () => {
  Audio.ensure();
  if (state.status === 'title'){ InputCtl.push('Any'); }
  else if (state.status === 'gameover'){ InputCtl.push('Restart'); }
});

// resize: auto-pause if playing
function onResize(){
  computeLayout();
  if (state.status === 'playing'){ state.status = 'paused'; InputCtl.reset(); }
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

computeLayout();

// fixed-timestep loop
let acc = 0;
let last = performance.now();
function frame(now){
  let delta = now - last; last = now;
  if (delta > 250) delta = 250;
  acc += delta;
  while (acc >= STEP_MS){
    InputCtl.tick(STEP_MS);
    const intents = InputCtl.drain();
    step(state, intents);
    acc -= STEP_MS;
  }
  render(state);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
