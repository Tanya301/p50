<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>p50 — Tetris</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;background:#0b0d12;color:#e6e9f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #app{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;flex-direction:column;gap:14px;padding:10px}
  #stage{display:flex;flex-direction:row;align-items:flex-start;gap:14px}
  canvas{background:#000;border:2px solid #1e2536;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.55);display:block;touch-action:none}
  #touch{display:none;gap:10px}
  .btn{background:linear-gradient(180deg,#222a3d,#181f2c);color:#dfe6f5;border:1px solid #2c3550;border-radius:10px;font-size:20px;font-weight:600;min-width:64px;min-height:64px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #10141d,0 6px 14px rgba(0,0,0,.4);cursor:pointer;touch-action:manipulation}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #10141d,0 3px 6px rgba(0,0,0,.4)}
  .row{display:flex;flex-direction:row;gap:10px}
  .col{display:flex;flex-direction:column;gap:10px}
  #touch.portrait{flex-direction:row;justify-content:center;width:100%}
  #touch.landscape{flex-direction:row}
  @media (pointer:coarse), (max-width:767px){
    #touch{display:flex}
  }
  .hint{font-size:12px;color:#7d869d;text-align:center;letter-spacing:.5px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
  </div>
  <div id="touch" class="portrait">
    <button class="btn" data-act="left" aria-label="left">◀</button>
    <button class="btn" data-act="rotate" aria-label="rotate">⟳</button>
    <button class="btn" data-act="drop" aria-label="hard drop">⤓</button>
    <button class="btn" data-act="right" aria-label="right">▶</button>
  </div>
  <div class="hint">← → move · ↑ rotate · ↓ soft · Space hard · P pause · R restart</div>
</div>
<script>
(() => {
"use strict";

// ---------- Constants ----------
const COLS = 10, ROWS = 20;
const LOGIC_HZ = 60, STEP_MS = 1000/LOGIC_HZ;
const DAS_MS = 170, ARR_MS = 50;
const SOFT_DROP_TICKS = 2;
const KINDS = ["I","O","T","S","Z","J","L"];
const COLORS = {I:"#46d6ff",O:"#ffd62e",T:"#c160ff",S:"#5dec7a",Z:"#ff5a6e",J:"#5a8bff",L:"#ffa14a",X:"#3b455e"};

// Rotation tables: 4x4 masks per rotation (bit grid)
// Use lists of [x,y] offsets relative to a 4x4 bounding box
function buildShapes(){
  // base shapes (rotation 0) inside 4x4 boxes
  const base = {
    I:[[0,1],[1,1],[2,1],[3,1]],
    O:[[1,0],[2,0],[1,1],[2,1]],
    T:[[1,0],[0,1],[1,1],[2,1]],
    S:[[1,0],[2,0],[0,1],[1,1]],
    Z:[[0,0],[1,0],[1,1],[2,1]],
    J:[[0,0],[0,1],[1,1],[2,1]],
    L:[[2,0],[0,1],[1,1],[2,1]],
  };
  const rot = (cells, kind) => {
    // I-piece rotates in a 4x4 box; others in a 3x3 box centered at (1,1)
    if (kind === "O") return cells.slice();
    if (kind === "I"){
      // rotate around center (1.5,1.5) in 4x4
      return cells.map(([x,y]) => [3-y, x]);
    }
    // rotate around (1,1) in 3x3
    return cells.map(([x,y]) => [1 - (y-1), 1 + (x-1)]);
  };
  const out = {};
  for (const k of KINDS){
    const s = [base[k]];
    for (let i=1;i<4;i++) s.push(rot(s[i-1], k));
    out[k] = s;
  }
  return out;
}
const SHAPES = buildShapes();

// ---------- 7-bag RNG ----------
function makeBag(){
  let bag = [];
  return () => {
    if (bag.length === 0){
      bag = KINDS.slice();
      for (let i=bag.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [bag[i],bag[j]] = [bag[j],bag[i]];
      }
    }
    return bag.shift();
  };
}

// ---------- State ----------
function emptyBoard(){
  const b = new Array(ROWS);
  for (let y=0;y<ROWS;y++){ b[y] = new Array(COLS).fill(null); }
  return b;
}
function spawnPiece(kind){
  // spawn near top center
  return { kind, rotation:0, x: 3, y: kind==="I" ? -1 : -1 };
}
function gravityPeriod(level){ return Math.max(1, 48 - level*5); }
function pieceCells(p){
  return SHAPES[p.kind][p.rotation].map(([dx,dy]) => [p.x + dx, p.y + dy]);
}
function canPlace(board, p){
  for (const [x,y] of pieceCells(p)){
    if (x < 0 || x >= COLS || y >= ROWS) return false;
    if (y >= 0 && board[y][x]) return false;
  }
  return true;
}
function lockPiece(board, p){
  for (const [x,y] of pieceCells(p)){
    if (y >= 0 && y < ROWS && x >= 0 && x < COLS){
      board[y][x] = p.kind;
    }
  }
}
function clearLines(board){
  let count = 0;
  for (let y=ROWS-1;y>=0;y--){
    let full = true;
    for (let x=0;x<COLS;x++){ if (!board[y][x]){ full=false; break; } }
    if (full){
      board.splice(y,1);
      board.unshift(new Array(COLS).fill(null));
      count++;
      y++;
    }
  }
  return count;
}
function scoreForLines(n, level){
  return [0,40,100,300,1200][n] * (level + 1);
}

// ---------- Audio ----------
let audioCtx = null;
function ensureAudio(){
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e){ audioCtx = null; }
}
function tone(freq, dur, type="square", gain=0.06){
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = gain;
  o.connect(g); g.connect(audioCtx.destination);
  const t = audioCtx.currentTime;
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
function playSfx(event){
  ensureAudio();
  if (!audioCtx) return;
  if (event === "lock"){ tone(110, 0.08, "square", 0.05); }
  else if (event === "clear"){ tone(660, 0.12, "triangle", 0.07); tone(880, 0.12, "triangle", 0.05); }
  else if (event === "tetris"){
    tone(523, 0.1, "square", 0.08);
    setTimeout(()=>tone(659,0.1,"square",0.08),60);
    setTimeout(()=>tone(784,0.1,"square",0.08),120);
    setTimeout(()=>tone(1046,0.2,"square",0.08),180);
  }
  else if (event === "gameover"){
    tone(330, 0.15, "sawtooth", 0.07);
    setTimeout(()=>tone(247,0.18,"sawtooth",0.07),140);
    setTimeout(()=>tone(196,0.3,"sawtooth",0.07),320);
  }
}

// ---------- Persistence ----------
function readBest(){
  try {
    const v = localStorage.getItem("p50.bestScore");
    if (v == null) return null;
    const n = parseInt(v, 10);
    if (!Number.isFinite(n) || n < 0 || String(n) !== v.trim()) return null;
    return n;
  } catch(e){ return null; }
}
function writeBest(score){
  try {
    const cur = readBest();
    if (cur == null || score > cur) localStorage.setItem("p50.bestScore", String(score));
  } catch(e){}
}

// ---------- Game ----------
const nextPiece = makeBag();
const state = {
  board: emptyBoard(),
  active: null,
  nextKind: null,
  score: 0,
  lines: 0,
  level: 0,
  status: "title", // 'title' | 'playing' | 'paused' | 'gameover'
  gravityTicks: 48,
  gravityCounter: 0,
  softDropCounter: 0,
  best: readBest(),
  flash: 0, // ticks remaining for line-clear flash
  flashRows: [],
};

function startNewGame(){
  state.board = emptyBoard();
  state.score = 0;
  state.lines = 0;
  state.level = 0;
  state.gravityTicks = gravityPeriod(0);
  state.gravityCounter = 0;
  state.softDropCounter = 0;
  state.nextKind = nextPiece();
  state.active = spawnPiece(state.nextKind);
  state.nextKind = nextPiece();
  state.status = "playing";
  state.flash = 0;
  state.flashRows = [];
}

function spawnNext(){
  state.active = spawnPiece(state.nextKind);
  state.nextKind = nextPiece();
  if (!canPlace(state.board, state.active)){
    state.status = "gameover";
    playSfx("gameover");
    if (state.score > 0) writeBest(state.score);
    state.best = readBest();
  }
}

function tryMove(dx, dy){
  const p = state.active;
  if (!p) return false;
  const cand = { kind:p.kind, rotation:p.rotation, x:p.x+dx, y:p.y+dy };
  if (canPlace(state.board, cand)){
    state.active = cand;
    return true;
  }
  return false;
}
function tryRotate(){
  const p = state.active;
  if (!p) return false;
  const cand = { kind:p.kind, rotation:(p.rotation+1)%4, x:p.x, y:p.y };
  if (canPlace(state.board, cand)){
    state.active = cand;
    return true;
  }
  return false;
}
function hardDrop(){
  let d = 0;
  while (tryMove(0,1)) d++;
  state.score += 2*d;
  lockAndAdvance();
}
function lockAndAdvance(){
  lockPiece(state.board, state.active);
  playSfx("lock");
  // detect filled rows for flash
  const filled = [];
  for (let y=0;y<ROWS;y++){
    let full=true;
    for (let x=0;x<COLS;x++){ if (!state.board[y][x]){ full=false; break; } }
    if (full) filled.push(y);
  }
  if (filled.length){
    const n = clearLines(state.board);
    state.score += scoreForLines(n, state.level);
    state.lines += n;
    const newLevel = Math.floor(state.lines / 10);
    if (newLevel !== state.level){
      state.level = newLevel;
      state.gravityTicks = gravityPeriod(state.level);
    }
    state.flash = 10;
    state.flashRows = filled.slice();
    if (n === 4) playSfx("tetris"); else playSfx("clear");
  }
  state.gravityCounter = 0;
  state.softDropCounter = 0;
  state.active = null; // spawn on next tick
}

function step(intents){
  if (state.status !== "playing") return;
  // process intents
  let softDropHeld = false;
  for (const ev of intents){
    if (ev === "MoveLeft") tryMove(-1,0);
    else if (ev === "MoveRight") tryMove(1,0);
    else if (ev === "RotateCW") tryRotate();
    else if (ev === "HardDrop"){ if (state.active) hardDrop(); }
    else if (ev === "SoftDropHeld") softDropHeld = true;
  }
  if (state.flash > 0){ state.flash--; return; }
  if (!state.active){ spawnNext(); return; }

  // gravity
  state.gravityCounter++;
  let gravityFired = false;
  if (state.gravityCounter >= state.gravityTicks){
    state.gravityCounter = 0;
    if (!tryMove(0,1)){
      lockAndAdvance();
      return;
    } else {
      gravityFired = true;
    }
  }
  // soft drop
  if (softDropHeld){
    state.softDropCounter++;
    if (state.softDropCounter >= SOFT_DROP_TICKS){
      state.softDropCounter = 0;
      // only soft-drop if natural gravity didn't already move this tick
      if (!gravityFired){
        if (tryMove(0,1)){
          state.score += 1;
        } else {
          lockAndAdvance();
        }
      }
    }
  } else {
    state.softDropCounter = 0;
  }
}

// ---------- Input ----------
const input = (() => {
  const queue = [];
  const held = {}; // key -> {dasStart, lastRepeat, intent}
  const KEY_TO_INTENT = {
    "ArrowLeft": "MoveLeft",
    "ArrowRight": "MoveRight",
  };
  function fireMove(intent){ queue.push(intent); }
  function reset(){
    for (const k in held) delete held[k];
  }
  function drain(){
    const out = queue.slice();
    queue.length = 0;
    return out;
  }
  function tickHeldKeys(now){
    for (const k in held){
      const h = held[k];
      if (!h.dasFired){
        if (now - h.downAt >= DAS_MS){
          h.dasFired = true;
          h.lastRepeat = now;
          fireMove(h.intent);
        }
      } else {
        while (now - h.lastRepeat >= ARR_MS){
          h.lastRepeat += ARR_MS;
          fireMove(h.intent);
        }
      }
    }
  }
  function isSoftDropHeld(){
    return !!held["ArrowDown"];
  }
  function softDropDown(){ /* tracked via held */ }
  function keydown(e){
    const k = e.key;
    if (state.status === "title"){
      // any key starts
      e.preventDefault();
      startNewGame();
      return;
    }
    if (state.status === "gameover"){
      if (k === "r" || k === "R"){ e.preventDefault(); startNewGame(); }
      return;
    }
    if (state.status === "paused"){
      if (k === "p" || k === "P"){ e.preventDefault(); state.status = "playing"; reset(); }
      else if (k === "r" || k === "R"){ e.preventDefault(); state.status = "title"; reset(); }
      return;
    }
    // playing
    if (k === "p" || k === "P"){
      e.preventDefault();
      state.status = "paused";
      reset();
      queue.length = 0;
      return;
    }
    if (k === "ArrowLeft" || k === "ArrowRight"){
      e.preventDefault();
      if (!held[k]){
        const intent = KEY_TO_INTENT[k];
        held[k] = { downAt: performance.now(), lastRepeat: 0, dasFired:false, intent };
        fireMove(intent);
      }
      return;
    }
    if (k === "ArrowUp" || k === "x" || k === "X"){
      e.preventDefault();
      if (!e.repeat) queue.push("RotateCW");
      return;
    }
    if (k === "ArrowDown"){
      e.preventDefault();
      held["ArrowDown"] = { downAt: performance.now() };
      return;
    }
    if (k === " " || k === "Spacebar"){
      e.preventDefault();
      if (!e.repeat) queue.push("HardDrop");
      return;
    }
  }
  function keyup(e){
    const k = e.key;
    if (held[k]) delete held[k];
  }
  return { keydown, keyup, drain, tickHeldKeys, isSoftDropHeld, reset, queue };
})();

window.addEventListener("keydown", input.keydown, { passive:false });
window.addEventListener("keyup", input.keyup, { passive:false });

// Touch controls
function setupTouch(){
  const buttons = document.querySelectorAll("#touch .btn");
  buttons.forEach(btn => {
    const act = btn.dataset.act;
    const fire = (e) => {
      e.preventDefault();
      ensureAudio();
      if (state.status === "title"){ startNewGame(); return; }
      if (state.status === "gameover"){ startNewGame(); return; }
      if (state.status === "paused"){ return; }
      if (act === "left") input.queue.push("MoveLeft");
      else if (act === "right") input.queue.push("MoveRight");
      else if (act === "rotate") input.queue.push("RotateCW");
      else if (act === "drop") input.queue.push("HardDrop");
    };
    btn.addEventListener("touchstart", fire, { passive:false });
    btn.addEventListener("mousedown", fire);
  });
}
setupTouch();

// Also: clicking on the canvas starts/restarts (for desktop title click)
const canvas = document.getElementById("game");
canvas.addEventListener("pointerdown", (e) => {
  ensureAudio();
  if (state.status === "title") startNewGame();
  else if (state.status === "gameover") startNewGame();
});

// ---------- Sizing ----------
let cellPx = 30, hudWidth = 160, layoutMode = "desktop";
function computeLayout(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const touch = document.getElementById("touch");
  let mode;
  // determine cellPx
  if (vw >= 768 && vh >= 600){
    cellPx = 30; mode = "desktop";
  } else if (vw < 768){
    cellPx = Math.max(14, Math.floor(vw / 12));
    mode = "portrait";
  } else {
    // vw>=768 and vh<600
    cellPx = Math.max(12, Math.floor(vh / 22));
    mode = "landscape";
  }
  hudWidth = Math.round(cellPx * 5);
  // touch button layout
  touch.classList.remove("portrait","landscape");
  if (mode === "landscape") touch.classList.add("landscape");
  else touch.classList.add("portrait");
  layoutMode = mode;
}
function resizeCanvas(){
  computeLayout();
  // HUD position: portrait => above, else right
  const portraitHud = (layoutMode === "portrait" && window.innerWidth < 480);
  // We'll always draw HUD to the right for simplicity unless very narrow.
  const cssW = COLS*cellPx + (portraitHud ? 0 : hudWidth) + 4;
  const cssH = ROWS*cellPx + (portraitHud ? Math.round(cellPx*4) : 0) + 4;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  canvas._cssW = cssW; canvas._cssH = cssH; canvas._portraitHud = portraitHud;
}
window.addEventListener("resize", () => {
  if (state.status === "playing") state.status = "paused";
  resizeCanvas();
});
window.addEventListener("orientationchange", () => {
  if (state.status === "playing") state.status = "paused";
  resizeCanvas();
});

// ---------- Rendering ----------
function drawCell(ctx, px, py, color, size){
  ctx.fillStyle = color;
  ctx.fillRect(px, py, size, size);
  // inner highlight
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(px, py, size, Math.max(2, size*0.15));
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(px, py + size - Math.max(2, size*0.15), size, Math.max(2, size*0.15));
  // border
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1;
  ctx.strokeRect(px+0.5, py+0.5, size-1, size-1);
}

function render(){
  const ctx = canvas.getContext("2d");
  const W = canvas._cssW, H = canvas._cssH;
  const portraitHud = canvas._portraitHud;
  ctx.fillStyle = "#0b0d12";
  ctx.fillRect(0,0,W,H);

  // board origin
  const boardX = 2;
  const boardY = portraitHud ? Math.round(cellPx*4) + 2 : 2;

  // playfield background
  ctx.fillStyle = "#06080d";
  ctx.fillRect(boardX, boardY, COLS*cellPx, ROWS*cellPx);

  // subtle grid
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  for (let x=1;x<COLS;x++){
    ctx.beginPath();
    ctx.moveTo(boardX + x*cellPx + 0.5, boardY);
    ctx.lineTo(boardX + x*cellPx + 0.5, boardY + ROWS*cellPx);
    ctx.stroke();
  }
  for (let y=1;y<ROWS;y++){
    ctx.beginPath();
    ctx.moveTo(boardX, boardY + y*cellPx + 0.5);
    ctx.lineTo(boardX + COLS*cellPx, boardY + y*cellPx + 0.5);
    ctx.stroke();
  }

  // locked cells
  for (let y=0;y<ROWS;y++){
    for (let x=0;x<COLS;x++){
      const v = state.board[y][x];
      if (v){
        drawCell(ctx, boardX + x*cellPx, boardY + y*cellPx, COLORS[v], cellPx);
      }
    }
  }

  // flash for cleared rows
  if (state.flash > 0 && state.flashRows.length){
    const alpha = state.flash / 10;
    ctx.fillStyle = `rgba(255,255,255,${0.3*alpha + 0.2})`;
    for (const y of state.flashRows){
      ctx.fillRect(boardX, boardY + y*cellPx, COLS*cellPx, cellPx);
    }
  }

  // ghost piece + active piece
  if (state.active && state.status === "playing" && state.flash === 0){
    // ghost
    let ghostY = state.active.y;
    const g = { ...state.active };
    while (true){
      const c = { ...g, y: g.y + 1 };
      if (canPlace(state.board, c)){ g.y = c.y; } else break;
    }
    for (const [x,y] of pieceCells(g)){
      if (y >= 0){
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.fillRect(boardX + x*cellPx, boardY + y*cellPx, cellPx, cellPx);
        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.strokeRect(boardX + x*cellPx + 0.5, boardY + y*cellPx + 0.5, cellPx-1, cellPx-1);
      }
    }
    // active
    for (const [x,y] of pieceCells(state.active)){
      if (y >= 0){
        drawCell(ctx, boardX + x*cellPx, boardY + y*cellPx, COLORS[state.active.kind], cellPx);
      }
    }
  }

  // border around board
  ctx.strokeStyle = "#1e2536";
  ctx.lineWidth = 2;
  ctx.strokeRect(boardX-1, boardY-1, COLS*cellPx+2, ROWS*cellPx+2);

  // HUD
  const hudX = portraitHud ? 2 : (boardX + COLS*cellPx + 14);
  const hudY = portraitHud ? 2 : boardY;
  const fSize = Math.max(11, Math.round(cellPx*0.5));
  ctx.fillStyle = "#cbd3e6";
  ctx.font = `${fSize}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.textBaseline = "top";

  ctx.fillStyle = "#7d869d"; ctx.fillText("SCORE", hudX, hudY);
  ctx.fillStyle = "#f3f6ff"; ctx.font = `bold ${Math.round(fSize*1.3)}px monospace`;
  ctx.fillText(String(state.score).padStart(6,"0"), hudX, hudY + fSize + 2);

  let yc = hudY + fSize + Math.round(fSize*1.3) + 14;
  ctx.font = `${fSize}px -apple-system, sans-serif`;
  ctx.fillStyle = "#7d869d"; ctx.fillText("LINES", hudX, yc);
  ctx.fillStyle = "#f3f6ff"; ctx.font = `bold ${Math.round(fSize*1.2)}px monospace`;
  ctx.fillText(String(state.lines), hudX, yc + fSize + 2);

  yc += fSize + Math.round(fSize*1.2) + 12;
  ctx.font = `${fSize}px -apple-system, sans-serif`;
  ctx.fillStyle = "#7d869d"; ctx.fillText("LEVEL", hudX, yc);
  ctx.fillStyle = "#f3f6ff"; ctx.font = `bold ${Math.round(fSize*1.2)}px monospace`;
  ctx.fillText(String(state.level), hudX, yc + fSize + 2);

  yc += fSize + Math.round(fSize*1.2) + 12;
  ctx.font = `${fSize}px -apple-system, sans-serif`;
  ctx.fillStyle = "#7d869d"; ctx.fillText("BEST", hudX, yc);
  ctx.fillStyle = "#f3f6ff"; ctx.font = `bold ${Math.round(fSize*1.1)}px monospace`;
  const bestStr = state.best == null ? "—" : String(state.best);
  ctx.fillText(bestStr, hudX, yc + fSize + 2);

  yc += fSize + Math.round(fSize*1.1) + 14;
  ctx.font = `${fSize}px -apple-system, sans-serif`;
  ctx.fillStyle = "#7d869d"; ctx.fillText("NEXT", hudX, yc);
  // next piece preview
  if (state.nextKind){
    const pcells = SHAPES[state.nextKind][0];
    const previewCell = Math.round(cellPx * 0.7);
    const px0 = hudX;
    const py0 = yc + fSize + 6;
    // background
    ctx.fillStyle = "#06080d";
    ctx.fillRect(px0, py0, previewCell*4 + 4, previewCell*3 + 4);
    for (const [dx,dy] of pcells){
      drawCell(ctx, px0 + 2 + dx*previewCell, py0 + 2 + dy*previewCell, COLORS[state.nextKind], previewCell);
    }
  }

  // overlays
  if (state.status === "title" || state.status === "paused" || state.status === "gameover"){
    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.fillRect(boardX, boardY, COLS*cellPx, ROWS*cellPx);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f3f6ff";
    const cx = boardX + COLS*cellPx/2;
    const cy = boardY + ROWS*cellPx/2;
    if (state.status === "title"){
      ctx.font = `bold ${Math.round(cellPx*1.3)}px -apple-system, sans-serif`;
      ctx.fillText("TETRIS", cx, cy - cellPx*2);
      ctx.font = `${Math.round(cellPx*0.55)}px -apple-system, sans-serif`;
      ctx.fillStyle = "#cbd3e6";
      ctx.fillText("press any key", cx, cy - cellPx*0.3);
      ctx.fillText("to start", cx, cy + cellPx*0.4);
      ctx.font = `${Math.round(cellPx*0.45)}px -apple-system, sans-serif`;
      ctx.fillStyle = "#7d869d";
      ctx.fillText("Best: " + (state.best == null ? "—" : state.best), cx, cy + cellPx*1.7);
    } else if (state.status === "paused"){
      ctx.font = `bold ${Math.round(cellPx*1.1)}px -apple-system, sans-serif`;
      ctx.fillText("PAUSED", cx, cy - cellPx*0.5);
      ctx.font = `${Math.round(cellPx*0.5)}px -apple-system, sans-serif`;
      ctx.fillStyle = "#cbd3e6";
      ctx.fillText("P to resume · R to title", cx, cy + cellPx*0.6);
    } else if (state.status === "gameover"){
      ctx.font = `bold ${Math.round(cellPx*1.0)}px -apple-system, sans-serif`;
      ctx.fillText("GAME OVER", cx, cy - cellPx*1.5);
      ctx.font = `${Math.round(cellPx*0.6)}px monospace`;
      ctx.fillStyle = "#f3f6ff";
      ctx.fillText("Score: " + state.score, cx, cy - cellPx*0.2);
      if (state.best != null){
        ctx.font = `${Math.round(cellPx*0.5)}px monospace`;
        ctx.fillStyle = "#cbd3e6";
        ctx.fillText("Best: " + state.best, cx, cy + cellPx*0.6);
      }
      ctx.font = `${Math.round(cellPx*0.5)}px -apple-system, sans-serif`;
      ctx.fillStyle = "#7d869d";
      ctx.fillText("press R to restart", cx, cy + cellPx*1.7);
    }
    ctx.textAlign = "start";
  }
}

// ---------- Main loop ----------
let acc = 0, last = performance.now();
function frame(now){
  acc += now - last;
  last = now;
  // cap accumulator to avoid spiral of death
  if (acc > 250) acc = 250;
  while (acc >= STEP_MS){
    input.tickHeldKeys(now);
    let intents = input.drain();
    if (input.isSoftDropHeld()) intents.push("SoftDropHeld");
    if (state.status === "playing"){
      step(intents);
    } else {
      // drop intents that arrived in non-playing states (already filtered in keydown)
    }
    acc -= STEP_MS;
  }
  render();
  requestAnimationFrame(frame);
}

resizeCanvas();
requestAnimationFrame((t)=>{ last = t; requestAnimationFrame(frame); });

})();
</script>
